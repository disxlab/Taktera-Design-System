name: Taktera Design System — Beta gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 27_beta_readiness_3/qa/check_sources.py
  react:
    name: React typecheck / build / SSR smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: 17_packages/react
      - run: npm run verify
        working-directory: 17_packages/react
  avalonia:
    name: Avalonia Release compilation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj
      - run: dotnet build 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj --configuration Release --no-restore -warnaserror
