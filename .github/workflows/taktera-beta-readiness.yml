name: Taktera Design System — Beta gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taktera-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static checks and brand freeze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python 27_beta_readiness_3/qa/check_sources.py
      - run: python 28_engineering/qa/check_hardening.py
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node --version
      - run: node 25_internal_completion/src/test_formatters.mjs
      - run: python 28_engineering/qa/check_board.py
      - name: Protect approved resources against BR3 baseline
        run: git diff --exit-code 4621646e21d987b86d8c9c21662e04c94a0b4d0b HEAD -- 01_brandbook 02_logos 03_icons 04_tokens 05_typography 06_templates 14_brand_extensions 25_internal_completion/src/tokens.canonical.json
  react:
    name: React typecheck / build / SSR smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node --version
      - run: npm ci --no-audit --no-fund
        working-directory: 17_packages/react
      - run: npm run verify
        working-directory: 17_packages/react
      - run: npx --no-install tsx --test qa/advanced-grid.test.ts qa/integration-core.test.ts
        working-directory: 17_packages/react
  avalonia:
    name: Avalonia Release compilation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj
      - run: dotnet build 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj --configuration Release --no-restore -warnaserror
  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: npm audit (high/critical gate)
        run: npm audit --audit-level=high --json > ../../npm-audit.json
        working-directory: 17_packages/react
      - name: NuGet audit (direct and transitive)
        if: ${{ !cancelled() }}
        run: dotnet restore 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1900,NU1903,NU1904,NU1905
      - name: NuGet vulnerability report
        if: ${{ !cancelled() }}
        run: dotnet list 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj package --vulnerable --include-transitive --format json > nuget-audit.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: dependency-audit
          path: |
            npm-audit.json
            nuget-audit.json
          if-no-files-found: error
  browser:
    name: Browser and axe QA
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node --version
      - run: npm ci --no-audit --no-fund
        working-directory: 17_packages/react
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: 17_packages/react
      - run: npm run qa:browser -- ${{ matrix.engine }}
        working-directory: 17_packages/react
      - name: React hydration and interaction
        if: ${{ !cancelled() }}
        run: npx --no-install tsx qa/react-browser.ts ${{ matrix.engine }}
        working-directory: 17_packages/react
      - name: Project Board persistence and snapshot QA
        if: ${{ !cancelled() }}
        run: node qa/board-browser.mjs ${{ matrix.engine }}
        working-directory: 17_packages/react
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: browser-${{ matrix.engine }}
          path: |
            28_engineering/qa/results/${{ matrix.engine }}
            28_engineering/qa/results/react-${{ matrix.engine }}
            28_engineering/qa/results/board-${{ matrix.engine }}
          if-no-files-found: warn
  headless:
    name: Avalonia headless XUnit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore 17_packages/avalonia/tests/Taktera.Headless.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1900,NU1903,NU1904,NU1905
      - run: dotnet test 17_packages/avalonia/tests/Taktera.Headless.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=headless.trx" --results-directory headless-results
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: headless-${{ matrix.os }}
          path: headless-results
          if-no-files-found: warn
  board-sync:
    name: Project Board GitHub issue snapshot
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read issue states (no write permission)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/${{ github.repository }}/issues?state=all&per_page=100' > issues-api.json
          python 28_engineering/qa/sync_issues.py issues-api.json github-issues-snapshot.json
      - uses: actions/upload-artifact@v6
        with:
          name: github-issues-snapshot
          path: github-issues-snapshot.json
          if-no-files-found: error
