# Copy into .github/workflows/taktera-ui.yml when this folder becomes part of a Git repository.
# This is NOT an already executed CI pipeline.
name: Taktera UI alpha.2 gates
on:
  push:
  pull_request:
jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright lxml
      - run: python -m playwright install chromium
      - run: python 17_packages/qa/validate_static.py
      - run: python 17_packages/qa/test_web.py
      - run: npm install
        working-directory: 17_packages/react
      - run: npm run typecheck
        working-directory: 17_packages/react
      - run: npm run build
        working-directory: 17_packages/react
  avalonia:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj
      - run: dotnet build 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj -c Release --no-restore
