# Template; copy into an actual repository's .github/workflows/ and adjust paths.
# NOT run by GitHub Actions in this artifact session.
name: Taktera Design System Alpha.3 gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright lxml
      - run: python -m playwright install chromium
      - run: python 17_packages/qa/validate_static.py
      - run: python 17_packages/qa/test_web.py
      - run: python 18_beta_readiness/qa/test_alpha3.py
      - run: python 18_beta_readiness/qa/verify_install.py
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile gate still open: npm install is intentionally used instead of a misleading npm ci.
      - run: npm install
        working-directory: 17_packages/react
      - run: npm run typecheck
        working-directory: 17_packages/react
      - run: npm run build
        working-directory: 17_packages/react
  avalonia:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj
      - run: dotnet build 17_packages/avalonia/sample/TakteraUiAvalonia.Sample.csproj -c Release --no-restore
